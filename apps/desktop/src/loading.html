<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeepSeek Harness — Loading</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 40px 48px;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.2);
    }
    h1 { font-size: 24px; margin-bottom: 8px; letter-spacing: -0.02em; }
    p { font-size: 14px; color: #94a3b8; margin-bottom: 24px; }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(99, 102, 241, 0.25);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hint { font-size: 12px; color: #64748b; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h1>DeepSeek Harness</h1>
    <p>Запуск рабочего окружения…</p>
    <div class="hint">Если окно не появилось, проверьте консоль разработчика (F12).</div>
  </div>
  <script>
    // Minimal dev-only bridge so the page can open the real app once ready.
    window.addEventListener('load', () => {
      const api = window.__DSH_DESKTOP__
      if (api) {
        console.log('[dsh-desktop] preload ready, packaged =', api.app.isPackaged())
      }
    })
  </script>
</body>
</html>
