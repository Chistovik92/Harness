name: Release Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            flags: --win --x64
          - os: macos-latest
            flags: --mac --arm64 --x64
          - os: ubuntu-latest
            flags: --linux --x64 --arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Checkout CI config from default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: ci-src

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Older tags declare apps/desktop-app as a root workspace whose lockfile
      # is not committed, and carry a stale package version. Normalise both so
      # every tag builds the same way and publishes to its own release.
      - name: Apply current electron-builder config and resources
        shell: bash
        run: cp -r ci-src/apps/desktop-app/electron-builder.json ci-src/apps/desktop-app/resources apps/desktop-app/

      - name: Prepare package metadata
        shell: bash
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));delete p.workspaces;fs.writeFileSync('package.json',JSON.stringify(p,null,2))"
          cd apps/desktop-app
          npm pkg set version="${RELEASE_TAG#v}"

      - name: Install dependencies
        working-directory: apps/desktop-app
        shell: bash
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Typecheck and unit tests
        if: runner.os == 'Linux' && hashFiles('apps/desktop-app/src/__tests__/**') != ''
        working-directory: apps/desktop-app
        run: npm run typecheck && npm test

      - name: Build app
        working-directory: apps/desktop-app
        run: npm run build

      # llama.cpp binaries come as per-platform packages. A runner only installs its own,
      # but mac/linux builds target two architectures, so fetch both; drop CUDA builds
      # (hundreds of MB, need a CUDA toolkit anyway) and every other OS.
      - name: Prepare llama.cpp binaries
        shell: bash
        working-directory: apps/desktop-app
        run: |
          [ -d node_modules/node-llama-cpp ] || exit 0
          ver=$(node -p "JSON.parse(require('fs').readFileSync('node_modules/node-llama-cpp/package.json','utf8')).version")
          case "$RUNNER_OS" in
            macOS) want="mac-x64 mac-arm64-metal" ;;
            Linux) want="linux-x64 linux-x64-vulkan linux-arm64" ;;
            *) want="" ;;
          esac
          for name in $want; do
            [ -d "node_modules/@node-llama-cpp/$name" ] || npm install --no-save --force --no-audit --no-fund "@node-llama-cpp/$name@$ver"
          done
          case "$RUNNER_OS" in Windows) os=win ;; macOS) os=mac ;; *) os=linux ;; esac
          for d in node_modules/@node-llama-cpp/*/; do
            n=$(basename "$d")
            case "$n" in
              *cuda*|*armv7l*|*riscv64*) rm -rf "$d" ;;
              "$os"-*) ;;
              *) rm -rf "$d" ;;
            esac
          done
          ls node_modules/@node-llama-cpp

      # onnxruntime-node ships binaries for every OS (>200 MB); keep only this runner's.
      - name: Prune foreign ONNX runtime binaries
        shell: bash
        working-directory: apps/desktop-app
        run: |
          dir=node_modules/onnxruntime-node/bin/napi-v3
          case "$RUNNER_OS" in Windows) keep=win32 ;; macOS) keep=darwin ;; *) keep=linux ;; esac
          if [ -d "$dir" ]; then
            for d in "$dir"/*/; do [ "$(basename "$d")" = "$keep" ] || rm -rf "$d"; done
          fi

      - name: Package and publish
        working-directory: apps/desktop-app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
        run: npx electron-builder ${{ matrix.flags }} --publish always
