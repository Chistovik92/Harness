name: Release Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release (e.g. v1.0.0)'
        required: true

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            flags: --win --x64
          - os: macos-latest
            flags: --mac --arm64 --x64
          - os: ubuntu-latest
            flags: --linux --x64 --arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Checkout CI config from default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: ci-src

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install rpm tooling
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      # Older tags declare apps/desktop-app as a root workspace whose lockfile
      # is not committed, and carry a stale package version. Normalise both so
      # every tag builds the same way and publishes to its own release.
      - name: Apply current electron-builder config
        shell: bash
        run: cp ci-src/apps/desktop-app/electron-builder.json apps/desktop-app/electron-builder.json

      - name: Prepare package metadata
        shell: bash
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));delete p.workspaces;fs.writeFileSync('package.json',JSON.stringify(p,null,2))"
          cd apps/desktop-app
          npm pkg set version="${RELEASE_TAG#v}"

      - name: Install dependencies
        working-directory: apps/desktop-app
        shell: bash
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Build app
        working-directory: apps/desktop-app
        run: npm run build

      - name: Package and publish
        working-directory: apps/desktop-app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
        run: npx electron-builder ${{ matrix.flags }} --publish always
